name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }}, py${{ matrix.runtime.python }}, node${{ matrix.runtime.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime:
          - {python: "3.11", node: "18"}
          - {python: "3.12", node: "24"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          # v0.23.1: keep compatibility changes intentional and reproducible.
          ref: 3b421578588243f920886e6fe79a6faa87ea026e
          path: .hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime.node }}
      - name: Offline regression tests (no Cursor login or secrets)
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-agent:${{ github.workspace }}
          CURSOR_LIVE: "0"
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q -o addopts= --cov=. --cov-report=term-missing
      - name: CLI and package checks
        run: |
          node --check bin/cli.js
          node --check scripts/next-version.js
          node bin/cli.js help
          npm pack --dry-run

  # Keep this name stable: main branch protection requires exactly `test`.
  test:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
